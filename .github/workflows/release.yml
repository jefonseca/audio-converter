name: Debian release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: audio-converter-deb
          path: '*.deb'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb_files=(./*.deb)
          gh release create "$GITHUB_REF_NAME" "${deb_files[@]}" \
            --title "audio-converter $GITHUB_REF_NAME" \
            --generate-notes
